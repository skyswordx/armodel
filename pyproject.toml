[project]
name = "armodel"
version = "0.1.0"
description = "Model-side workspace for Roboclaw arm perception, smoVLA post-training, and inference."
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
